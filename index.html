<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap — Share What You Know. Learn What You Love.</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        body { background-color: #090d16; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500 selection:text-slate-950">

    <!-- APP ROOT -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // --- MOCK DATABASE & STATE ---
        const State = {
            currentView: 'landing', 
            authMode: 'signin', 
            currentUser: JSON.parse(localStorage.getItem('ss_user')) || null,
            users: JSON.parse(localStorage.getItem('ss_users')) || [
                { id: 'u1', name: 'Elena Vance', email: 'elena@example.com', bio: 'Senior UI/UX Designer looking to learn backend coding.', location: 'San Francisco, CA', timezone: 'PST', level: 'Expert', teach: ['UI/UX Design', 'Figma', 'Graphic Design'], learn: ['Python', 'Node.js'] },
                { id: 'u2', name: 'Marcus Chen', email: 'marcus@example.com', bio: 'Full-stack developer wanting to master video editing for tech vlogs.', location: 'New York, NY', timezone: 'EST', level: 'Intermediate', teach: ['JavaScript', 'React', 'Python'], learn: ['Video Editing', 'Premiere Pro'] },
                { id: 'u3', name: 'Aaliyah Patel', email: 'aaliyah@example.com', bio: 'Professional photographer and content creator exploring Spanish.', location: 'London, UK', timezone: 'GMT', level: 'Advanced', teach: ['Photography', 'Lightroom', 'Video Editing'], learn: ['Spanish', 'Digital Marketing'] }
            ],
            requests: JSON.parse(localStorage.getItem('ss_requests')) || [],
            messages: JSON.parse(localStorage.getItem('ss_messages')) || [],
            sessions: JSON.parse(localStorage.getItem('ss_sessions')) || [],
            reviews: JSON.parse(localStorage.getItem('ss_reviews')) || []
        };

        function persist() {
            localStorage.setItem('ss_user', JSON.stringify(State.currentUser));
            localStorage.setItem('ss_users', JSON.stringify(State.users));
            localStorage.setItem('ss_requests', JSON.stringify(State.requests));
            localStorage.setItem('ss_messages', JSON.stringify(State.messages));
            localStorage.setItem('ss_sessions', JSON.stringify(State.sessions));
            localStorage.setItem('ss_reviews', JSON.stringify(State.reviews));
        }

        function switchView(view) {
            State.currentView = view;
            render();
            window.scrollTo(0, 0);
        }

        // --- RENDER CONTROLLER ---
        function render() {
            const root = document.getElementById('app');
            root.innerHTML = `
                ${renderNavbar()}
                <main class="flex-grow flex flex-col fade-in">
                    ${getStateView()}
                </main>
                ${renderFooter()}
            `;
        }

        function getStateView() {
            if (!State.currentUser && State.currentView === 'auth') return renderAuthView();
            if (!State.currentUser) return renderLandingView();
            
            switch(State.currentView) {
                case 'dashboard': return renderDashboardView();
                case 'matches': return renderMatchesView();
                case 'messages': return renderMessagesView();
                case 'sessions': return renderSessionsView();
                case 'profile': return renderProfileView();
                case 'admin': return renderAdminView();
                default: return renderDashboardView();
            }
        }

        // --- COMPONENTS ---
        function renderNavbar() {
            const isAdmin = State.currentUser && State.currentUser.email === 'admin@skillswap.com';
            return `
                <header class="sticky top-0 z-50 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('${State.currentUser ? 'dashboard' : 'landing'}')">
                            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-emerald-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-purple-900/40">
                                <i class="fa-solid fa-rotate"></i>
                            </div>
                            <div>
                                <span class="text-xl font-extrabold tracking-tight text-white">Skill<span class="text-emerald-400">Swap</span></span>
                                <span class="block text-[10px] text-purple-400 font-semibold uppercase tracking-widest">P2P Learning</span>
                            </div>
                        </div>

                        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                            ${State.currentUser ? `
                                <button onclick="switchView('dashboard')" class="hover:text-emerald-400 transition ${State.currentView === 'dashboard' ? 'text-emerald-400 font-bold' : 'text-slate-300'}">Dashboard</button>
                                <button onclick="switchView('matches')" class="hover:text-emerald-400 transition ${State.currentView === 'matches' ? 'text-emerald-400 font-bold' : 'text-slate-300'}">Find Matches</button>
                                <button onclick="switchView('messages')" class="hover:text-emerald-400 transition ${State.currentView === 'messages' ? 'text-emerald-400 font-bold' : 'text-slate-300'}">Messages</button>
                                <button onclick="switchView('sessions')" class="hover:text-emerald-400 transition ${State.currentView === 'sessions' ? 'text-emerald-400 font-bold' : 'text-slate-300'}">Sessions</button>
                                ${isAdmin ? `<button onclick="switchView('admin')" class="text-purple-400 font-bold hover:text-purple-300 transition">Admin Panel</button>` : ''}
                            ` : `
                                <a href="#features" class="text-slate-300 hover:text-emerald-400 transition">Features</a>
                                <a href="#how-it-works" class="text-slate-300 hover:text-emerald-400 transition">How It Works</a>
                            `}
                        </nav>

                        <div class="flex items-center space-x-3">
                            ${State.currentUser ? `
                                <button onclick="switchView('profile')" class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700 hover:border-emerald-500/50 transition">
                                    <div class="w-7 h-7 rounded-full bg-purple-600 flex items-center justify-center font-bold text-xs text-white">
                                        ${State.currentUser.name.charAt(0)}
                                    </div>
                                    <span class="text-sm font-medium text-slate-200 hidden sm:inline">${State.currentUser.name}</span>
                                </button>
                                <button onclick="logout()" class="p-2 text-slate-400 hover:text-rose-400 transition" title="Logout">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </button>
                            ` : `
                                <button onclick="switchAuthMode('signin'); switchView('auth');" class="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-white transition">Sign In</button>
                                <button onclick="switchAuthMode('signup'); switchView('auth');" class="px-4 py-2 text-sm font-semibold bg-emerald-500 text-slate-950 rounded-xl hover:bg-emerald-400 transition shadow-lg shadow-emerald-500/20">Get Started</button>
                            `}
                        </div>
                    </div>
                </header>
            `;
        }

        function renderLandingView() {
            return `
                <div class="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center">
                    <span class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 inline-block mb-6">🚀 Welcome to the Future of Peer Learning</span>
                    <h1 class="text-4xl sm:text-6xl font-black text-white tracking-tight max-w-3xl mx-auto mb-6">
                        Share What You Know. <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-emerald-400">Learn What You Love.</span>
                    </h1>
                    <p class="text-lg text-slate-400 max-w-2xl mx-auto mb-10">
                        Connect with skilled peers globally. Trade your expertise for knowledge without expensive course fees.
                    </p>
                    <div class="flex justify-center gap-4">
                        <button onclick="switchAuthMode('signup'); switchView('auth');" class="px-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-2xl transition shadow-xl shadow-emerald-500/20">Create Free Account</button>
                        <button onclick="switchAuthMode('signin'); switchView('auth');" class="px-8 py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-2xl transition border border-slate-700">Sign In</button>
                    </div>
                </div>
            `;
        }

        function renderAuthView() {
            return `
                <div class="flex-grow flex items-center justify-center px-4 py-12">
                    <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-xl">
                        <h2 class="text-2xl font-black text-white mb-2">${State.authMode === 'signin' ? 'Welcome Back' : 'Create Account'}</h2>
                        <p class="text-sm text-slate-400 mb-6">Enter your details to continue your learning journey.</p>
                        
                        <form onsubmit="handleAuth(event)" class="space-y-4">
                            ${State.authMode === 'signup' ? `
                                <div>
                                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Full Name</label>
                                    <input type="text" id="authName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-emerald-500 outline-none">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Email Address</label>
                                <input type="email" id="authEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-emerald-500 outline-none" placeholder="you@example.com">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-emerald-500/20">
                                ${State.authMode === 'signin' ? 'Sign In' : 'Sign Up'}
                            </button>
                        </form>
                        <div class="mt-6 text-center text-sm text-slate-400">
                            ${State.authMode === 'signin' ? "Don't have an account?" : "Already have an account?"}
                            <button onclick="toggleAuthMode()" class="text-emerald-400 font-bold ml-1 hover:underline">
                                ${State.authMode === 'signin' ? 'Sign Up' : 'Sign In'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboardView() {
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
                    <h1 class="text-3xl font-black text-white mb-2">Hello, ${State.currentUser.name} 👋</h1>
                    <p class="text-slate-400 mb-8">Here is your skill-swapping activity overview.</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <h3 class="text-slate-400 text-sm font-semibold">Skills You Teach</h3>
                            <p class="text-xl font-bold text-emerald-400 mt-2">${State.currentUser.teach ? State.currentUser.teach.join(', ') : 'None'}</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <h3 class="text-slate-400 text-sm font-semibold">Skills You Want to Learn</h3>
                            <p class="text-xl font-bold text-purple-400 mt-2">${State.currentUser.learn ? State.currentUser.learn.join(', ') : 'None'}</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex items-center justify-between">
                            <div>
                                <h3 class="text-slate-400 text-sm font-semibold">Find Matches</h3>
                                <p class="text-sm text-slate-300 mt-1">Connect with compatible peers.</p>
                            </div>
                            <button onclick="switchView('matches')" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl transition">Explore</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMatchesView() {
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
                    <h1 class="text-3xl font-black text-white mb-2">Discover Peer Matches</h1>
                    <p class="text-slate-400 mb-8">Find users matching your learning interests.</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${State.users.filter(u => u.email !== State.currentUser.email).map(u => `
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between">
                                <div>
                                    <h3 class="text-lg font-bold text-white">${u.name}</h3>
                                    <p class="text-xs text-purple-400 mt-1">${u.location}</p>
                                    <p class="text-sm text-slate-300 mt-3">${u.bio}</p>
                                </div>
                                <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                                    <span class="text-xs text-emerald-400 font-semibold">Teaches: ${u.teach.join(', ')}</span>
                                    <button onclick="alert('Connection request sent to ${u.name}!')" class="px-3 py-1.5 bg-emerald-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-emerald-400">Connect</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMessagesView() { return `<div class="max-w-7xl mx-auto px-4 py-10 text-white">Messages module active.</div>`; }
        function renderSessionsView() { return `<div class="max-w-7xl mx-auto px-4 py-10 text-white">Sessions module active.</div>`; }
        function renderProfileView() { return `<div class="max-w-7xl mx-auto px-4 py-10 text-white">Profile settings active.</div>`; }
        function renderAdminView() { return `<div class="max-w-7xl mx-auto px-4 py-10 text-white">Admin panel active.</div>`; }

        function renderFooter() {
            return `
                <footer class="border-t border-slate-800 py-8 text-center text-slate-500 text-sm">
                    <p>&copy; 2026 SkillSwap. All rights reserved.</p>
                </footer>
            `;
        }

        function switchAuthMode(mode) {
            State.authMode = mode;
            render();
        }

        function toggleAuthMode() {
            State.authMode = State.authMode === 'signin' ? 'signup' : 'signin';
            render();
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const name = State.authMode === 'signup' ? document.getElementById('authName').value : email.split('@')[0];
            
            State.currentUser = { id: 'u_' + Date.now(), name, email, bio: 'New learner on SkillSwap.', location: 'Global', teach: ['JavaScript'], learn: ['Design'] };
            persist();
            switchView('dashboard');
        }

        function logout() {
            State.currentUser = null;
            localStorage.removeItem('ss_user');
            switchView('landing');
        }

        // Initialize App Render
        render();
    </script>
</body>
</html>
